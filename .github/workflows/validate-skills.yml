name: Validate scaling-skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate setup syntax
        run: bash -n setup setup.sh

      - name: Validate Agent Skills compatibility
        run: bash scripts/validate-agent-skills.sh

      - name: Validate setup installation
        run: bash scripts/validate-setup-install.sh

      - name: Validate setup doctor
        run: ./setup --doctor
